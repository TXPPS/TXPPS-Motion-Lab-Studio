<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="TXPPS MotionLab Studio — Professional Music Production. Anywhere."
    />
    <meta name="theme-color" content="#191715" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      Generated from assets/MotionLab Studio - Logo & App Icon.png by
      `npm run icons`, so a tab, a home screen and a splash all show the same
      mark. The 16px is listed as well as the 32: a browser given only the
      larger one downsamples it itself, and the graticule in this artwork
      aliases badly at that size.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      IBM Plex, in three widths of one superfamily: Sans for content, Sans
      Condensed for the uppercase micro-labels a 96px channel strip is made of,
      and Mono for every number in the product. Drawn for engineering
      documentation, so it has a mechanical voice at 10px, real tabular figures
      and a slashed zero — and it is deliberately none of the faces the "AI
      slop" critiques name first (Inter, Roboto, Poppins, Montserrat).

      A DAW must paint its chrome on the first frame and work with no network
      at all, so the stylesheet is NOT linked here: a `<link rel=stylesheet>`
      blocks rendering until it resolves, and `display=swap` governs the font
      swap, not the fetch. Measured with the CDN unreachable, that link held
      first paint for 12.6 seconds before failing.

      main.tsx injects it after mount instead. The system UI face from --font
      paints immediately, Plex swaps in when it arrives, and if it never
      arrives nothing is lost. The preconnects stay because they cost nothing
      and are not render-blocking.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>TXPPS MotionLab Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
