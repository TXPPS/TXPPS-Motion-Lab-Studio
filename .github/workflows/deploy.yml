name: Deploy to Cloudflare (manual fallback)

# PRIMARY DEPLOYMENT PATH IS CLOUDFLARE WORKERS BUILDS, not this workflow.
# The Worker `txpps-motionlab-studio` is connected to this repository from the
# Cloudflare dashboard (Workers & Pages → the Worker → Settings → Build) and
# deploys automatically on every push to the production branch. Nothing needs to
# be configured in GitHub for that to work.
#
# This workflow is kept only as a manual fallback for the case where the Workers
# Builds connection is unavailable. It is intentionally NOT triggered on push:
# without the two secrets below it fails on the deploy step and would report a
# misleading failure on every commit.
#
# To use it, add these repository secrets and run it from the Actions tab:
#   CLOUDFLARE_API_TOKEN  — token created in the account that owns the Worker,
#                           permission "Workers Scripts: Edit" (account-scoped)
#   CLOUDFLARE_ACCOUNT_ID — the account id that owns the Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the build can stamp the git commit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Motion Wave's core is compiled to WebAssembly by `npm run build`, so the
      # runner needs the toolchain. Pinned to the version CLAUDE.md pins,
      # because the WASM boundary test asserts a bit-for-bit match against the
      # native golden render and a different compiler is entitled to disagree.
      #
      # Cached by that version: the install is a few minutes cold and seconds
      # warm, and it changes only when the pin does.
      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-4.0.7
      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 4.0.7
          ~/emsdk/emsdk activate 4.0.7
      - name: Point the build at emsdk
        run: echo "EMSDK_DIR=$HOME/emsdk" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build

      - name: Deploy Worker (static assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.workers.toml
