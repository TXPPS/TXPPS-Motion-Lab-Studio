name: Deploy to Cloudflare

# Builds the production bundle and deploys the Worker `txpps-motionlab-studio`
# (Workers Static Assets) — the same Worker created by the claimed deployment,
# now living in the claimed Cloudflare account (account id f28564ec53838541afae4ab618bb0977).
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token created IN THE CLAIMED ACCOUNT with permission
#                           "Workers Scripts: Edit" (Account-scoped)
#   CLOUDFLARE_ACCOUNT_ID — f28564ec53838541afae4ab618bb0977 (the claimed account)
#
# Alternative with zero GitHub secrets: connect this repo to Cloudflare
# "Workers Builds" from the Cloudflare dashboard (Workers & Pages → the Worker →
# Settings → Build) — build command `npm ci && npm run build`, deploy command
# `npx wrangler deploy -c wrangler.workers.toml`.

on:
  push:
    branches:
      - claude/motionlab-studio-poc-3l1gwa
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the build can stamp the git commit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy Worker (static assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.workers.toml
