name: CI

# Every push and every pull request. A test suite that only runs when somebody
# remembers to run it is a test suite that is already broken.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # All four projects, not two. CI ran `tsc -b` — which follows the root's
      # references to the app and the node config — plus the e2e project on its
      # own, and never `motionwave/ui/tsconfig.json`. The Motion Wave UI was
      # type-checked by nobody on a push. `npm run typecheck` is the four.
      - name: Type-check (all four projects)
        run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Motion Wave's own unit suite — 351 tests across 31 files that ran only
      # when somebody remembered. `scripts/check-checks.mjs` is what found that.
      - name: Motion Wave unit tests
        run: npm run test:mw
      # Motion Wave's core is compiled to WebAssembly by `npm run build`, so the
      # runner needs the toolchain. Pinned to the version CLAUDE.md pins,
      # because the WASM boundary test asserts a bit-for-bit match against the
      # native golden render and a different compiler is entitled to disagree.
      #
      # Cached by that version: the install is a few minutes cold and seconds
      # warm, and it changes only when the pin does.
      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-4.0.7
      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 4.0.7
          ~/emsdk/emsdk activate 4.0.7
      - name: Point the build at emsdk
        run: echo "EMSDK_DIR=$HOME/emsdk" >> "$GITHUB_ENV"
      # The tracked core is a build artefact in git, because the production
      # build must run where there is no C++ toolchain — Cloudflare's builder
      # does not have one. Its failure mode is going stale silently, so it is
      # verified here, where the toolchain does exist.
      - name: The tracked WebAssembly core matches its source
        run: npm run wasm:check
      # The C++ core's own suites, compiled to WebAssembly and run under Node.
      # Forty-one of them, and nothing on a push had ever executed one.
      - name: Motion Wave core tests
        run: npm run test:core
      # The golden curve table against the C++ law it mirrors. Needs a host
      # compiler, which this runner has and a Cloudflare builder does not —
      # which is why it is here rather than in `npm run build`.
      - name: The curve golden table matches the law
        run: npm run curve:check
      - name: Production build
        run: npm run build
      - name: Bundle budget
        run: node scripts/check-bundle.mjs

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Same toolchain as the check job — see the note there. The cache key is
      # shared, so this job warms or reuses whichever ran first.
      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-4.0.7
      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 4.0.7
          ~/emsdk/emsdk activate 4.0.7
      - name: Point the build at emsdk
        run: echo "EMSDK_DIR=$HOME/emsdk" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run e2e
      # The panel harness's browser suite: Ledger cells U21, U22 and V27 across
      # every unit that has a face. Its own server, its own config, and until
      # now no runner at all.
      - name: Motion Wave panel tests
        run: npm run e2e:mw
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
