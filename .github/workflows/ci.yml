name: CI

# Every push and every pull request. A test suite that only runs when somebody
# remembers to run it is a test suite that is already broken.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check (app and e2e)
        run: |
          npx tsc -b
          npm run typecheck:e2e
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Production build
        run: npm run build
      - name: Bundle budget
        run: node scripts/check-bundle.mjs

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
