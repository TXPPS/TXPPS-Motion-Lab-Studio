name: UI Lock source-art validation (review only)
on:
  push:
    branches:
      - feature/motionwave-vintage-control-library-cp03-04-20261103
permissions:
  contents: read
concurrency:
  group: ui-lock-source-art-cp04
  cancel-in-progress: true
jobs:
  vector-source:
    name: Check editable source and capture control-sheet pixels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose CP03 and CP04 formatting (temporary)
        shell: bash
        run: |
          for path in docs/design/MOTIONWAVE_VINTAGE_CP03_FOUR_UNIT_DESIGNS.md docs/design/MOTIONWAVE_CONTROL_ASSETS_CP04.md design-assets/motionwave-ui-lock/manifest.json; do
            printf '\n==== FORMATTING %s ====\n' "$path"
            npx prettier "$path" > /tmp/ui-lock-art-formatted
            diff -u "$path" /tmp/ui-lock-art-formatted || true
          done
      - name: Validate non-production original source-art manifest
        run: node scripts/qa/check-ui-lock-art.mjs
      - name: Install Chromium for visual evidence
        run: npx playwright install --with-deps chromium
      - name: Render authored SVG at full pixel size
        shell: bash
        run: |
          mkdir -p audit-out/ui-lock-cp04
          npx playwright screenshot --browser chromium --viewport-size="1600,920" "file://$GITHUB_WORKSPACE/design-assets/motionwave-ui-lock/controls-v0.svg" audit-out/ui-lock-cp04/controls-v0-desktop.png
          test -s audit-out/ui-lock-cp04/controls-v0-desktop.png
      - name: Upload only review artifacts (no production deployment)
        uses: actions/upload-artifact@v4
        with:
          name: motionwave-ui-lock-cp04-vector-art-review
          path: |
            audit-out/ui-lock-cp04/controls-v0-desktop.png
            design-assets/motionwave-ui-lock/controls-v0.svg
            design-assets/motionwave-ui-lock/manifest.json
          retention-days: 14
