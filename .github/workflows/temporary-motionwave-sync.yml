# TEMPORARY, isolated to the recovery feature branch. Remove after it
# regenerates source-of-truth codegen and the tracked WASM worklet.
name: Temporary Motion Wave WASM sync
on:
  push:
    branches:
      - chore/motionwave-audio-quality-recovery-cp01-20261102
permissions:
  contents: write
concurrency:
  group: temporary-motionwave-sync
  cancel-in-progress: true
jobs:
  regenerate:
    if: github.ref == 'refs/heads/chore/motionwave-audio-quality-recovery-cp01-20261102'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-4.0.7
      - name: Install pinned emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 4.0.7
          ~/emsdk/emsdk activate 4.0.7
      - run: echo "EMSDK_DIR=$HOME/emsdk" >> "$GITHUB_ENV"
      - name: Generate from manifests and rebuild worklet
        run: |
          npm run params
          npm run build:wasm
      - name: Commit only generated files to this recovery branch
        run: |
          set -euo pipefail
          git add motionwave/core/units/generated/granular_reverb_params.gen.h
          git add motionwave/ui/units/granular_reverb/params.gen.ts
          git add motionwave/wasm/prebuilt/motionwave.worklet.js
          if git diff --cached --quiet; then
            echo "Codegen and tracked worklet already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate verified Motion Wave WASM core [skip ci]"
          git push origin HEAD:chore/motionwave-audio-quality-recovery-cp01-20261102
